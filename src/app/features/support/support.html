<p-toast></p-toast>

@if (loading()) {
  <div class="spinner-container">
    <p-progressSpinner />
  </div>
} @else {
  <div class="support-page">
    <div class="support-card">
      <div class="support-header">
        <h2>Support Request</h2>
        <p>Fill out the form to submit a support request.</p>
      </div>

      <form
        #form="ngForm"
        (ngSubmit)="
          onSubmit(categoryInput.value, objectInput.value, descriptionInput.value, fileInput.value)
        "
      >
     <div class="form-field">
  <label for="category">Category</label>
  <p-select
    id="category"
    name="category"
    [(ngModel)]="selectedCategory"
    [options]="categoryOptions"
    optionLabel="label"
    optionValue="value"
    placeholder="Select a category"
    styleClass="w-full"
    #categoryInput
  ></p-select>
</div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input
            id="subject"
            name="subject"
            type="text"
            pInputText
            placeholder="Enter a short subject"
            #objectInput
          />
        </div>

        <div class="form-field">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            rows="7"
            pInputTextarea
            placeholder="Describe the issue or support request"
            #descriptionInput
          ></textarea>
        </div>

        <div class="form-field">
          <label for="attachment">Attach screenshot</label>
          <input
            id="attachment"
            name="attachment"
            type="file"
            accept="image/*"
            multiple
            #fileInput
          />
          <small>You can attach one or more screenshots.</small>
        </div>

        <div class="form-actions">
          <button type="button" (click)="onCancel()">Cancel</button>
          <button
            type="button"
            (click)="onClick()"
            (click)="
              onSubmit(
                categoryInput.value,
                objectInput.value,
                descriptionInput.value,
                fileInput.value
              )
            "
          >
            Submit Ticket
          </button>
        </div>
      </form>
    </div>
  </div>
}

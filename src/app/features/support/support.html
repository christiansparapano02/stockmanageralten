@if (loading()) {
  <div class="spinner-container">
    <p-progressSpinner />
  </div>
} @else {
  <div class="support-page">
    <div class="support-card">
      <div class="support-header">
        <h2>Richiesta supporto</h2>
        <p>Compila il form per inviare una richiesta di assistenza.</p>
      </div>

      <form #form="ngForm" (ngSubmit)="onSubmit(categoryInput.value, objectInput.value, descriptionInput.value, fileInput.value)">
        <div class="form-field">
          <label for="category">Categoria</label>
          <select
            id="category"
            name="category"
            class="support-select"
            #categoryInput
          >
            <option value="" selected disabled>Seleziona una categoria</option>
            <option value="accesso">Problemi di accesso</option>
            <option value="inventario">Errore inventario</option>
            <option value="categorie">Problema categorie</option>
            <option value="ui">Problema interfaccia</option>
            <option value="altro">Altro</option>
          </select>
        </div>

        <div class="form-field">
          <label for="subject">Oggetto</label>
          <input
            id="subject"
            name="subject"
            type="text"
            pInputText
            placeholder="Inserisci un breve oggetto"
            #objectInput
          />
        </div>

        <div class="form-field">
          <label for="description">Descrizione</label>
          <textarea
            id="description"
            name="description"
            rows="7"
            pInputTextarea
            placeholder="Descrivi il problema o la richiesta di supporto"
            #descriptionInput
          ></textarea>
        </div>

        <div class="form-field">
          <label for="attachment">Allega screenshot</label>
          <input
            id="attachment"
            name="attachment"
            type="file"
            accept="image/*"
            multiple
            #fileInput
          />
          <small>Puoi allegare uno o più screenshot.</small>
        </div>

        <div class="form-actions">
          <button type="button">Annulla</button>
          <button type="button" (click)="onClick()" (click)="onSubmit(categoryInput.value, objectInput.value, descriptionInput.value, fileInput.value)">Invia ticket</button>
        </div>
      </form>
    </div>
  </div>
}

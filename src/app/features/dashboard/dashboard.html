<header class="dashboard-header">
  <div>
    <p class="eyebrow">Dashboard</p>
    <h1>Stock overview</h1>
  </div>

  @if (itemsNeedingAttention() > 0) {
    <button type="button" class="attention-banner" severity="danger" (click)="goToAlerts()">
      {{ itemsNeedingAttention() }} <span>items need attention</span>
      <span class="arrow-move">→</span>
    </button>
  }
</header>

<section class="dashboard">
  @if (loading()) {
    <p>Loading dashboard...</p>
  } @else {
    <div class="kpi-grid">
      <p-card class="kpi-card">
        <span class="kpi-label">Total items</span>
        <strong>{{ totalItems() }}</strong>
      </p-card>

      <p-card class="kpi-card">
        <span class="kpi-label">Total quantity</span>
        <strong>{{ totalQuantity() }}</strong>
      </p-card>

      <p-card class="kpi-card">
        <span class="kpi-label">Low stock</span>
        <strong>{{ low() }}</strong>
      </p-card>

      <p-card class="kpi-card">
        <span class="kpi-label">Critical</span>
        <strong>{{ critical() }}</strong>
      </p-card>
    </div>
  }
</section>
